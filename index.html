<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Il Guardiano · Ingressi Halloween</title>
  <meta name="description" content="Gestionale ingressi per la serata di Halloween: lista ospiti, scansione QR, capienza e incassi. Funziona offline.">
  <meta name="theme-color" content="#0d0a12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Guardiano">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M30 13c1-5 4-8 9-9" stroke="#5fbf5a" stroke-width="4.5" stroke-linecap="round" fill="none"/>
      <ellipse cx="20" cy="38" rx="15" ry="20" fill="#d9560a"/>
      <ellipse cx="44" cy="38" rx="15" ry="20" fill="#d9560a"/>
      <ellipse cx="32" cy="38" rx="14" ry="22" fill="#ff7a1a"/>
      <path d="M19 34l5.5-9 5.5 9zM34 34l5.5-9 5.5 9zM19.5 43l5 6.8 3.8-4.5 3.7 5.5 3.7-5.5 3.8 4.5 5-6.8z" fill="#1c0e00"/>
    </svg>
    <span id="brandName">Il Guardiano</span>
  </div>
  <button class="count-pill" id="topCount" data-tab="porta" aria-label="Persone in sala"><b>0</b><span></span></button>
</header>

<main id="view"></main>

<nav class="tabs" aria-label="Sezioni">
  <button data-tab="porta"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v17M3 21h18M12.5 12h.01M16 6h3a1 1 0 0 1 1 1v14"/></svg>Porta</button>
  <button data-tab="ospiti"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/></svg>Ospiti</button>
  <button data-tab="serata"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V11M10 20V4M16 20v-7M22 20H2"/></svg>Serata</button>
</nav>

<dialog id="sheet" aria-label="Scheda"></dialog>

<dialog id="scan" aria-label="Scanner QR">
  <div class="scan-wrap">
    <video id="scanVideo" playsinline muted></video>
    <div class="scan-top">
      <strong>Scansiona biglietto</strong>
      <button class="x" data-act="closeScan" aria-label="Chiudi scanner"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="scan-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="scan-bottom">
      <p id="scanMsg">Avvio fotocamera…</p>
      <form class="scan-manual" id="scanForm" autocomplete="off">
        <input id="scanCode" type="text" placeholder="Oppure scrivi il codice" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Codice biglietto">
        <button class="btn primary" type="submit">Vai</button>
      </form>
    </div>
    <div class="scan-result" id="scanResult" hidden></div>
  </div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>
<div id="print" aria-hidden="true"></div>
<input type="file" id="fileCsv" accept=".csv,.txt,text/csv,text/plain" hidden>
<input type="file" id="fileBackup" accept=".json,application/json" hidden>

<script src="qr.js"></script>
<script src="app.js"></script>
</body>
</html>
